<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIVE — Legal</title>
<style>
  :root{--bg:#f7f8f7;--card:#fff;--fg:#14201b;--muted:#5c6b64;--brand:#024532;--line:#e2e8e4}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1512;--card:#141d19;--fg:#e8efeb;--muted:#93a49c;--brand:#4fd1a5;--line:#233029}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:2rem;margin:0 0 8px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 40px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px;text-decoration:none;color:inherit}
  a.card:hover{border-color:var(--brand)}
  a.card strong{display:block;font-size:1.05rem;color:var(--brand);margin-bottom:4px}
  a.card span{color:var(--muted);font-size:.92rem}
  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
  footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1>PRIVE</h1>
  <p class="sub">Legal documents for the PRIVE mobile application.</p>

  <a class="card" href="privacy-policy.html">
    <strong>Privacy Policy</strong>
    <span>What data the app collects, why, who it is shared with, and your rights.</span>
  </a>

  <a class="card" href="delete-account.html">
    <strong>Delete Your Account</strong>
    <span>How to request deletion of your PRIVE account and associated data.</span>
  </a>

  <footer>
    Contact: <a href="mailto:prive.support@gmail.com">prive.support@gmail.com</a>
  </footer>
</div>
</body>
</html>
